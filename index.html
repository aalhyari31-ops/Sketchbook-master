<!DOCTYPE html>
<html>
<head>
    <title>FinTeClub</title>
    <style>
        /* إخفاء شعار جيت هب بالكامل من اللعبة */
        .github-corner { 
            display: none !important; 
        }

        /* إخفاء شاشة التحميل القديمة بالكامل من الـ HTML */
        #loading-screen {
            display: none !important;
        }

        /* تصميم مربع النص الخاص باسمك */
        #developer-name {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9); /* ظل أسود للنص عشان يقرأ بسهولة */
            z-index: 9999; /* لإبقاء النص فوق كل شيء */
            pointer-events: none; /* عشان ما يأثر على الماوس واللعب */
        }
        .swal2-container {
            display: none !important;
        }
    </style>
</head>
<body>
    
    <!-- اسمك اللي رح يظهر في الزاوية تحت -->
    <div id="developer-name">Developed by Antonio | Antonio Bishik™</div>

    <!-- أكواد تشغيل اللعبة الأساسية -->
    <script src="build/sketchbook.min.js"></script>
    <script>
        const world = new Sketchbook.World('build/assets/world.glb');
    </script>
</body>
</html>
